name: Benchmarks

# Measures the requests per second of the pull request (PR) and of its base on the same runner, and
# posts one comment on the PR that each push updates. Why the report does not fail: a shared runner
# is noisy, and the threshold is not tuned yet.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - "test/bench.ts"
      - "test/harness.ts"
      - "test/fixtures/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsdown.config.ts"
      - "tsconfig.json"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/bench.yml"
  workflow_dispatch:

concurrency:
  group: bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DO_NOT_TRACK: 1

jobs:
  # One job for each runtime, so the runs take less time. Base and head run in the same job, so
  # they share one machine.
  bench:
    name: bench (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun, deno]
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Checkout base 🛎️
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      # Use pnpm version from root package.json#packageManager
      - name: Install pnpm 📦
        uses: pnpm/action-setup@v6.1.1
        with:
          run_install: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Cache mise binary 🗃️
        uses: actions/cache@v6.1.0
        with:
          path: ~/.local/bin/mise
          key: mise-${{ runner.os }}-${{ hashFiles('scripts/install-mise') }}

      # Why the same paths and key as in vibe-check.yml: the two workflows then share one cache.
      - name: Cache Bun and Deno 🗃️
        if: matrix.runtime != 'node'
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.local/share/mise/installs/aqua-oven-sh-bun
            ~/.local/share/mise/installs/aqua-denoland-deno
          key: mise-runtimes-${{ runner.os }}-${{ hashFiles('mise.lock') }}

      # Why mise: mise.lock pins oha, Bun, and Deno, and the checksum of each of their downloads.
      # Why both runtimes in a Bun or Deno job: the job that saves the shared cache must hold both.
      - name: Install oha and the runtimes 🔧
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          ./scripts/install-mise
          mise trust ./mise.toml
          mise install aqua:hatoo/oha
          dirname "$(mise which oha)" >> "${GITHUB_PATH}"
          if [ "${RUNTIME}" != node ]; then
            mise install aqua:oven-sh/bun aqua:denoland/deno
            dirname "$(mise which "${RUNTIME}")" >> "${GITHUB_PATH}"
          fi

      - name: Build 🏗️
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build base 🏗️
        if: github.event_name == 'pull_request'
        working-directory: base
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Benchmark ⏱️
        env:
          RUNTIME: ${{ matrix.runtime }}
          BASE: ${{ github.event_name == 'pull_request' && 'base' || '' }}
        run: node test/bench.ts "${RUNTIME}" ${BASE:+--base "${BASE}"} --json "bench-${RUNTIME}.json"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bench-${{ matrix.runtime }}
          path: bench-${{ matrix.runtime }}.json

  report:
    needs: bench
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".nvmrc"

      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: bench-*
          path: results
          merge-multiple: true

      # Why the check of each runtime: a benchmark job that fails before its upload has no file, and
      # the table must not hide it.
      - name: Report 📊
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          files=()
          missing=()
          for runtime in node bun deno; do
            if [ -f "results/bench-${runtime}.json" ]; then
              files+=("results/bench-${runtime}.json")
            else
              missing+=("${runtime}")
            fi
          done
          if [ "${#files[@]}" -gt 0 ]; then
            # Why `|| true`: `report` exits with 1 when it marks a route, and the job only reports.
            node test/bench.ts report "${files[@]}" > report.md || true
          else
            printf '<!-- app-server-bench -->\n### Benchmarks\n\n' > report.md
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '\n⚠️ The benchmark of %s failed, so it is not in the table. See [the run](%s).\n' \
              "${missing[*]}" "${RUN_URL}" >> report.md
          fi
          cat report.md >> "${GITHUB_STEP_SUMMARY}"

      # Why the repository check: a PR from a fork gets a token that cannot comment.
      - name: Comment on the PR 💬
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          ids=$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- app-server-bench -->"))) | .id')
          id="${ids%%$'\n'*}"
          if [ -n "${id}" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${id}" -F body=@report.md > /dev/null
          else
            gh pr comment "${PR}" --repo "${REPO}" --body-file report.md
          fi
