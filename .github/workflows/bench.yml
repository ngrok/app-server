name: Benchmarks

# Measures the requests per second of the PR and of its base on the same runner, and posts one
# comment on the PR that each push updates. Why not in vibe-check: a shared runner is noisy, so
# this check reports and does not block a merge.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - "test/bench.ts"
      - "test/harness.ts"
      - "test/fixtures/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsdown.config.ts"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/bench.yml"
  workflow_dispatch:

concurrency:
  group: bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DO_NOT_TRACK: 1

jobs:
  # One job for each runtime, so the runs take less time. Base and head run in the same job, so
  # they share one machine.
  bench:
    name: bench (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun, deno]
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Checkout base 🛎️
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      # Use pnpm version from root package.json#packageManager
      - name: Install pnpm 📦
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.8

      - name: Cache mise binary 🗃️
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/mise
          key: mise-${{ runner.os }}-${{ hashFiles('scripts/install-mise') }}

      # Why mise: mise.lock pins oha and the checksum of each of its downloads.
      - name: Install oha 🔧
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          ./scripts/install-mise
          mise trust ./mise.toml
          mise install aqua:hatoo/oha
          dirname "$(mise which oha)" >> "${GITHUB_PATH}"

      - name: Build 🏗️
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build base 🏗️
        if: github.event_name == 'pull_request'
        working-directory: base
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Benchmark ⏱️
        env:
          RUNTIME: ${{ matrix.runtime }}
          BASE: ${{ github.event_name == 'pull_request' && 'base' || '' }}
        run: node test/bench.ts "${RUNTIME}" ${BASE:+--base "${BASE}"} --json "bench-${RUNTIME}.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ matrix.runtime }}
          path: bench-${{ matrix.runtime }}.json

  report:
    needs: bench
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bench-*
          path: results
          merge-multiple: true

      - name: Report 📊
        id: report
        run: |
          status=0
          node test/bench.ts report results/*.json > report.md || status=$?
          cat report.md >> "${GITHUB_STEP_SUMMARY}"
          echo "status=${status}" >> "${GITHUB_OUTPUT}"

      # Why the repository check: a PR from a fork gets a token that cannot comment.
      - name: Comment on the PR 💬
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          ids=$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- app-server-bench -->"))) | .id')
          id="${ids%%$'\n'*}"
          if [ -n "${id}" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${id}" -F body=@report.md > /dev/null
          else
            gh pr comment "${PR}" --repo "${REPO}" --body-file report.md
          fi

      - name: Fail on a slower route
        if: steps.report.outputs.status != '0'
        run: |
          echo "::error::A route got slower by more than the threshold, or its server exits under load. See the job summary."
          exit 1
